[project]
name = "nba-persistence"
version = "1.0.0"
description = "NBA 'Persistence' exercise"
readme = "README.md"
license = { text = "NA" }
requires-python = ">=3.12,<4.0"
authors = [{ name = "irod973" }]
dependencies = [
  "loguru>=0.7.2,<1.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
]

[project.urls]
Repository = "https://github.com/irod973/nba-persistence"

[dependency-groups]
checks = [
  "bandit>=1.7.9,<2.0.0",
  "coverage>=7.5.4,<8.0.0",
  "mypy>=1.10.1,<2.0.0",
  "pytest>=8.2.2,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "ruff>=0.5.0,<1.0.0",
  "pytest-mock>=3.14.0,<4.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]
commits = [
  "commitizen>=3.27.0,<4.0.0",
  "pre-commit>=3.7.1,<4.0.0",
]
dev = [
  {include-group = "checks"},
  "invoke>=2.2.0,<3.0.0",
  "requests>=2.32.3,<3.0.0",
  "locust>=2.31.8,<3.0.0",
  "pyinstrument>=4.7.3,<5.0.0",
]
docs = [
  "pdoc>=14.5.1,<15.0.0",
]
nba-persistence = [
    "nba-api>=1.11.3",
    "pandas>=2.3.3",
]

[tool.uv]
default-groups = ["checks", "commits", "dev"]

[tool.bandit]
targets = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.mypy]
plugins = ["pydantic.mypy"]
pretty = true
strict = false
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = "import-untyped"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]
